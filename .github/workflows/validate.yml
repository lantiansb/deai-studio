name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate distributable files
        run: python scripts/build_release.py --validate-only
      - name: Run release tests
        run: python -m unittest discover -s tests
      - name: Build release archive
        run: python scripts/build_release.py --out dist
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: deai-studio-release
          path: dist/*.zip
